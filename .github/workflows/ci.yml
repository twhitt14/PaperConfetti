name: Package and example

on:
  push:
    branches: [dev, main]
    tags: ['*']
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Xcode ${{ matrix.xcode }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            xcode: '16.4'
          - runner: macos-26
            xcode: '26.6'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_${{ matrix.xcode }}.app
      - name: Test package, example, and documentation
        run: python3 tools/validate.py
      - name: Validate profiling automation
        run: |
          swift test --package-path Benchmarks
          python3 -m unittest discover -s tools/tests -v
          python3 tools/profile.py --simulator-smoke
          python3 tools/compare.py --simulator-smoke
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: tests-xcode-${{ matrix.xcode }}
          path: |
            .artifacts/validation-*/*.log
            .artifacts/validation-*/*.json
            .artifacts/validation-*/*.xcresult
            .artifacts/profile-*/*.json
            .artifacts/profile-*/*.html
            .artifacts/profile-*/*.log
            .artifacts/profile-*/*.xcresult
            .artifacts/study-*/**/*.json
            .artifacts/study-*/**/*.html
            .artifacts/study-*/**/*.log
            .artifacts/study-*/*.xcresult
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
